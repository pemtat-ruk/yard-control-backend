# ฐานข้อมูลสำหรับพัฒนาบนเครื่อง: docker compose up -d
# ค่าตรงกับ DATABASE_URL ใน .env.example — ห้ามใช้รหัสผ่านนี้นอกเครื่องนักพัฒนา
services:
  postgres:
    image: postgres:17-alpine
    container_name: ycs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yard_control
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ycs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yard_control"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ycs-postgres-data:
