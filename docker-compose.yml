# ฐานข้อมูลสำหรับพัฒนาบนเครื่อง: docker compose up -d
# ค่าตรงกับ DATABASE_URL ใน .env.example — ห้ามใช้รหัสผ่านนี้นอกเครื่องนักพัฒนา
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ycs-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Ycs-dev-Passw0rd"
      # เรียงลำดับและเทียบตัวอักษรไทยถูกต้อง ไม่สนตัวพิมพ์เล็ก/ใหญ่
      MSSQL_COLLATION: Thai_CI_AS
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - ycs-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ycs-sqlserver-data:
